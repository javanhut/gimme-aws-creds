# Generated by imlazy migrate from Makefile, then updated for uv

[settings]
default = "install"

[commands]

[commands.install]
desc = "Build the standalone binary at dist/gimme-aws-creds"
run = [
    "uv run --with pyinstaller pyinstaller --onefile --clean --noconfirm --log-level ERROR --paths . --collect-data fido2 --collect-submodules okta --name gimme-aws-creds --specpath build bin/gimme-aws-creds",
]

# `imlazy sync` itself is an imlazy built-in (Makefile sync); reach this one
# with `imlazy :sync` or `imlazy deps`. The make_init alias keeps the built-in
# from re-adding the Makefile's init target.
[commands.sync]
desc = "Install the project and dev dependencies into .venv"
run = ["uv sync"]
alias = ["deps", "make_init"]

[commands.test]
desc = "Run the unit tests"
run = ["uv run pytest -vv tests"]

[commands.format]
desc = "Format the code with black"
run = ["uv run black gimme_aws_creds tests lambda"]

[commands.docker-build]
desc = "Build the gimme-aws-creds Docker image"
run = ["docker build -t gimme-aws-creds ."]
